<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- Twitter のカードの絵（card.png、1200x630）を作る台。Edge のヘッドレスで --window-size=1200,630 で撮る -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #e4e8ee; font-family: "Zen Kaku Gothic New", "Yu Gothic", sans-serif; color: #1c2838; }
.l { position: absolute; left: 80px; top: 150px; width: 520px; }
h1 { font-family: "Dela Gothic One", "Yu Gothic", sans-serif; font-weight: 400; font-size: 112px; letter-spacing: 0.06em; margin: 0; line-height: 1.1; }
p { font-size: 34px; margin: 26px 0 0; font-weight: 700; line-height: 1.5; }
small { display: block; font-size: 24px; color: #5a6577; margin-top: 18px; font-weight: 400; }
.stage { position: absolute; left: 680px; top: 105px; width: 420px; height: 420px; perspective: 1600px; }
.paper { position: absolute; background: #fdfdfb; box-shadow: 0 2px 0 #c4cad6, 0 14px 40px rgba(28,40,56,.25); border-radius: 3px; }
.flap { position: absolute; transform-style: preserve-3d; transform-origin: 100% 50%; transform: rotateY(62deg); }
.flap .face { position: absolute; inset: 0; background: #fdfdfb; backface-visibility: hidden; box-shadow: 0 0 0 1px #c4cad6; }
.cell { position: absolute; box-sizing: border-box; border-right: 1px solid #eef0f3; border-bottom: 1px solid #eef0f3; }
.tile { position: absolute; inset: 12%; border-radius: 7px; display: grid; place-items: center; font-family: "Dela Gothic One", sans-serif; color: #fff; font-size: 30px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.c1 { background: #d1452a; } .c2 { background: #2d5cb0; } .c3 { background: #e0a00e; color: #3a2a00; }
.line { position: absolute; top: -18px; height: 456px; border-left: 3px dashed #1c2838; }
</style></head>
<body>
<div class="l"><h1>折り紙盤</h1><p>紙を折って、<br>重なったマスを合わせるパズル</p><small>練習5面・本編12面・おまけ6面</small></div>
<div class="stage" id="st"></div>
<script src="../core.js"></script>
<script src="../stages.js"></script>
<script>
// 本編4 の盤を、左半分を持ち上げて折りかけた形で描く
var st = STAGES.filter(function (s) { return s.id === 'M4'; })[0], c = 70, k = 3, html = [];
function tile(v) { return v ? '<div class="tile c' + Math.floor(v / 100) + '">' + (v % 100) + '</div>' : ''; }
html.push('<div class="paper" style="left:' + (k * c) + 'px;top:0;width:' + ((st.w - k) * c) + 'px;height:' + (st.h * c) + 'px"></div>');
for (var y = 0; y < st.h; y++) for (var x = k; x < st.w; x++)
  html.push('<div class="cell" style="left:' + (x * c) + 'px;top:' + (y * c) + 'px;width:' + c + 'px;height:' + c + 'px">' + tile(st.cells[y * st.w + x]) + '</div>');
var f = [];
for (y = 0; y < st.h; y++) for (x = 0; x < k; x++)
  f.push('<div class="cell" style="left:' + (x * c) + 'px;top:' + (y * c) + 'px;width:' + c + 'px;height:' + c + 'px">' + tile(st.cells[y * st.w + x]) + '</div>');
html.push('<div class="flap" style="left:0;top:0;width:' + (k * c) + 'px;height:' + (st.h * c) + 'px"><div class="face">' + f.join('') + '</div></div>');
html.push('<div class="line" style="left:' + (k * c - 1) + 'px"></div>');
document.getElementById('st').innerHTML = html.join('');
</script>
</body></html>
